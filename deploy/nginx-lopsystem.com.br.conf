server {
    listen 80;
    listen [::]:80;

    server_name lopsystem.com.br www.lopsystem.com.br;

    client_max_body_size 20M;

    location /static/ {
        alias /home/lopes-sistemas/lopes-sistemas/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /home/lopes-sistemas/lopes-sistemas/backend/media/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
