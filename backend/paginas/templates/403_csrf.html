<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sessão expirada | LopSystem - Soluções</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>
    :root {
        --paper: #F3F2EE;
        --ink: #1B1B18;
        --ink-dim: #63615A;
        --line: #DCDACF;
        --stamp: #B6392F;
        --stamp-deep: #8F2C25;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--paper);
        color: var(--ink);
        font-family: 'IBM Plex Sans', sans-serif;
        text-align: center;
        padding: 24px;
    }
    .wrap { max-width: 420px; }
    .code {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 72px;
        line-height: 1;
        color: var(--stamp);
        margin: 0 0 8px;
    }
    h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
        font-size: 24px;
        margin: 0 0 12px;
    }
    p {
        color: var(--ink-dim);
        font-size: 15px;
        line-height: 1.6;
        margin: 0 0 28px;
    }
    a.btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--stamp);
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        font-size: 14px;
        padding: 12px 24px;
        border-radius: 10px;
        transition: background-color 0.2s ease;
    }
    a.btn:hover { background: var(--stamp-deep); }
</style>
</head>
<body>
<div class="wrap">
<p class="code">403</p>
<h1>Sessão expirada.</h1>
<p>Por segurança, seu formulário não pôde ser enviado. Volte e tente novamente.</p>
<a class="btn" href="/">Voltar para o início</a>
</div>
</body>
</html>
