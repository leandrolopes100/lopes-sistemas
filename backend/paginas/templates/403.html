<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Acesso não permitido | LopSystem - Soluções</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
    :root {
        --paper: #FAFAF9;
        --ink: #111114;
        --ink-dim: #6B6D74;
        --line: #E4E4E9;
        --signal: #4F3DF5;
        --signal-deep: #3B2ED1;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--paper);
        color: var(--ink);
        font-family: 'Inter', sans-serif;
        text-align: center;
        padding: 24px;
    }
    .wrap { max-width: 420px; }
    .code {
        font-family: 'Instrument Sans', sans-serif;
        font-weight: 700;
        font-size: 72px;
        line-height: 1;
        color: var(--signal);
        margin: 0 0 8px;
    }
    h1 {
        font-family: 'Instrument Sans', sans-serif;
        font-weight: 600;
        font-size: 24px;
        margin: 0 0 12px;
    }
    p {
        color: var(--ink-dim);
        font-size: 15px;
        line-height: 1.6;
        margin: 0 0 28px;
    }
    a.btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--signal);
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        font-size: 14px;
        padding: 12px 24px;
        border-radius: 10px;
        transition: background-color 0.2s ease;
    }
    a.btn:hover { background: var(--signal-deep); }
</style>
</head>
<body>
<div class="wrap">
<p class="code">403</p>
<h1>Acesso não permitido.</h1>
<p>Você não tem permissão para acessar esta página.</p>
<a class="btn" href="/">Voltar para o início</a>
</div>
</body>
</html>
